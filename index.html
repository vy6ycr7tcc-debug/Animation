<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0a1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>The Inward Journey</title>
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<div id="surface" aria-hidden="true"></div>

<div id="title" aria-hidden="true">
  <h1><small>The</small> Inward Journey</h1>
  <p id="touch">Touch the water to begin</p>
</div>
<button id="begin" type="button" aria-label="Touch the water to begin"></button>

<div id="map" role="dialog" aria-labelledby="map-title" hidden>
  <p id="map-title">Where will you begin?</p>
  <canvas id="map-canvas"></canvas>
  <div id="map-places"></div>
  <p class="note">Tap a place, or anywhere on the land.</p>
  <button id="map-close" type="button" hidden>Stay where I am</button>
</div>

<p id="whisper" class="whisper" aria-hidden="true"></p>
<p id="sub" class="whisper" aria-live="polite"></p>

<div id="joy" hidden aria-hidden="true"><div id="knob"></div></div>
<button id="act" type="button" aria-label="Jump" hidden><span></span></button>

<button id="menu-btn" type="button" aria-label="Settings" aria-expanded="false" aria-controls="menu" hidden><span></span></button>
<div id="menu" role="dialog" aria-label="Settings" hidden>
  <label for="vol">Volume</label>
  <input id="vol" type="range" min="0" max="1" step="0.05" value="0.8">
  <label class="check"><input id="voice" type="checkbox" checked> Narration</label>
  <label class="check"><input id="subs" type="checkbox" checked> Subtitles</label>
  <label class="check"><input id="reduced" type="checkbox"> Reduce motion</label>
  <button id="map-open" type="button">Map</button>
  <button id="leave" type="button">Leave</button>
  <button id="restart" type="button">Begin again</button>
  <p class="note">Leave keeps your place on this device.</p>
</div>

<div id="rest" hidden>
  <p>Your place is kept.</p>
  <button id="return" type="button">Touch the water to return</button>
</div>

<section id="stats" aria-label="Frame readings" hidden><pre id="stats-text">measuring…</pre></section>
<div id="live" class="sr" aria-live="polite"></div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
